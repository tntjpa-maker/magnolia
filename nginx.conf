server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Ambiente de homologação: impede indexação sem bloquear os testes públicos.
    # Esta diretiva pertence somente à branch prototipo-botanica-2026.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Mantém versões históricas fora da navegação e evita conteúdo duplicado.
    location = /indexOLD.html {
        return 301 /;
    }

    location = /Lp_v1.html {
        return 301 /;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~ (?:^|/)index\.html$ {
        expires -1;
    }
}
